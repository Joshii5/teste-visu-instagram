<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Carrossel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .phone {
            width: 100%;
            max-width: 100%;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .scroll {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 10px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            cursor: grab;
        }

        .scroll:active {
            cursor: grabbing;
        }

        .scroll::-webkit-scrollbar {
            display: none;
        }

        .imagem {
            flex: 0 0 auto;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #fff;
            scroll-snap-align: start;
        }

        .imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="scroll" id="carrossel">
            <div class="imagem"><img src="imagens/1.png" alt=""></div>
            <div class="imagem"><img src="imagens/2.png" alt=""></div>
            <div class="imagem"><img src="imagens/3.png" alt=""></div>
            <div class="imagem"><img src="imagens/4.png" alt=""></div>
            <div class="imagem"><img src="imagens/5.png" alt=""></div>
            <div class="imagem"><img src="imagens/6.png" alt=""></div>
            <div class="imagem"><img src="imagens/7.png" alt=""></div>
            <div class="imagem"><img src="imagens/8.png" alt=""></div>
            <div class="imagem"><img src="imagens/9.png" alt=""></div>
            <div class="imagem"><img src="imagens/10.png" alt=""></div>
            <div class="imagem"><img src="imagens/11.png" alt=""></div>
        </div>
    </div>

    <script>
        (function() {
            const scroll = document.getElementById('carrossel');
            let isDown = false;
            let startX = 0;
            let scrollLeft = 0;

            function onStart(e) {
                isDown = true;
                const pageX = e.type === 'mousedown' ? e.pageX : e.touches[0].pageX;
                startX = pageX - scroll.offsetLeft;
                scrollLeft = scroll.scrollLeft;
                scroll.style.scrollSnapType = 'none';
            }

            function onMove(e) {
                if (!isDown) return;
                e.preventDefault();
                const pageX = e.type === 'mousemove' ? e.pageX : e.touches[0].pageX;
                const x = pageX - scroll.offsetLeft;
                const walk = (x - startX) * 1.5;
                scroll.scrollLeft = scrollLeft - walk;
            }

            function onEnd() {
                isDown = false;
                scroll.style.scrollSnapType = 'x mandatory';
            }

            scroll.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            scroll.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd, { passive: true });
        })();
    </script>
</body>
</html>
