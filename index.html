    <title>Instagram Stories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .phone {
            width: 100%;
            max-width: 400px;
            background: #eeeeee;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .sscroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 16px 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll::-webkit-scrollbar {
            display: none;
        }

        .imagem {
            flex: 0 0 auto;
            width: 1080px;
            height: 1350px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e4405f;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
